# Integración continua: verifica cada PR a develop/main y los push a esas ramas.
# El gate replica lo que el hook pre-push corre en local, pero en el servidor (no es
# saltable). Los e2e usan dependencias falsas (E2E=true), así que NO necesitan claves
# reales de OpenRouter ni de búsqueda.
name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

# Cancela ejecuciones antiguas del mismo ref si llega un push nuevo: ahorra minutos de CI.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Valores deterministas SOLO para CI (no son secretos reales): los mismos que usan los
  # tests en vitest.config.ts. La validación fail-fast de lib/config/env los exige al
  # cargar la app durante build, test y e2e.
  DATABASE_URL: "file:./ci.db"
  AUTH_SECRET: "ci-secret-do-not-use-in-prod-0123456789"
  ENCRYPTION_KEY: "MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="
  APP_URL: "http://localhost:3000"

jobs:
  quality:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` dispara el postinstall (prisma generate), que crea src/generated/prisma.
      - run: npm ci

      # Base de datos lista para el build (algunas páginas consultan Prisma al renderizar).
      - run: npm run db:deploy

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Solo Chromium: es el único proyecto declarado en playwright.config.ts.
      - name: Instalar navegador de Playwright
        run: npx playwright install --with-deps chromium

      # webServer (en playwright.config.ts) hace el build y arranca la app con E2E=true,
      # que activa las dependencias falsas del pipeline y desactiva el rate limit de auth.
      - name: Tests e2e
        run: npm run test:e2e
        env:
          CI: "true"
          E2E: "true"

      - name: Subir el informe de Playwright si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
